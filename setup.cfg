[metadata]
name = gpx-analyzer
version = 0.1
description = A cli tool to extract gpx file and generate a map
author = PenHsuanWang
license = MIT
platforms = unix, linux, osx, win32
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.10

[options]
package_dir =
    = src
packages = find:
install_requires =
    click
    folium>=0.14.0
    numpy>=1.25.0
    Pillow>=9.0.0
    reportlab>=4.0.0
python_requires = >=3.10
zip_safe = False

[options.packages.find]
where = src

[options.extras_require]
testing =
    pytest>=6.0
    pytest-cov>=2.0
    mypy>=0.910
    flake8>3.9
    tox>=3.24

[options.entry_points]
console_scripts =
    gpxana = cli:main

[flake8]
max-line-length = 140
